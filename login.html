<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | SMoney</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .logo span {
            color: #2563eb;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .forgot {
            display: block;
            text-align: right;
            margin-top: -8px;
            margin-bottom: 20px;
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            background: #93c5fd;
            cursor: not-allowed;
        }

        .signup {
            text-align: center;
            margin-top: 22px;
            color: #6b7280;
        }

        .signup a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #374151;
            text-decoration: none;
        }

        #message {
            display: none;
            margin-top: 18px;
            padding: 14px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }

        #message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        #message.error {
            display: block;
            background: #fee2e2;
            color: #b91c1c;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        S<span>Money</span>
    </div>

    <div class="card">

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Login to your SMoney account
        </p>

        <form id="loginForm">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <a href="#" class="forgot" id="forgotPassword">
                Forgot Password?
            </a>

            <button type="submit" id="loginButton">
                Login
            </button>

        </form>

        <div id="message"></div>

        <div class="signup">
            Don't have an account?
            <a href="signup.html">Create Account</a>
        </div>

        <a href="index.html" class="back">
            ← Back to SMoney
        </a>

    </div>

</div>

<script type="module">

    /* =========================================
       SUPABASE CONNECTION
       ========================================= */

    import { createClient } from
        "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    const SUPABASE_URL =
        "https://ljmpfkdursxpoxkhdvel.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxqbXBma2R1cnN4cG94a2hkdmVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMTE0NzMsImV4cCI6MjEwMjg4NzQ3M30.u7aYKII3RPLNrIz5sn9xzxXFuPg79Fabm6filX1vHF8";


    const supabase = createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


    /* =========================================
       GET PAGE ELEMENTS
       ========================================= */

    const form =
        document.getElementById("loginForm");

    const button =
        document.getElementById("loginButton");

    const message =
        document.getElementById("message");

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const forgotPassword =
        document.getElementById("forgotPassword");


    /* =========================================
       MESSAGE FUNCTION
       ========================================= */

    function showMessage(text, type) {

        message.textContent = text;

        message.className = type;

    }


    /* =========================================
       CHECK IF USER IS ALREADY LOGGED IN
       ========================================= */

    async function checkAuthStatus() {

        try {

            const {
                data: { session },
                error
            } = await supabase.auth.getSession();


            if (error) {

                console.error(
                    "Session check error:",
                    error
                );

                return;

            }


            if (session) {

                window.location.href =
                    "dashboard.html";

            }

        } catch (error) {

            console.error(
                "Auth check error:",
                error
            );

        }

    }


    checkAuthStatus();


    /* =========================================
       LOGIN
       ========================================= */

    form.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const email =
                emailInput.value.trim();

            const password =
                passwordInput.value;


            message.className = "";

            message.textContent = "";


            if (!email || !password) {

                showMessage(
                    "Please enter your email and password.",
                    "error"
                );

                return;

            }


            button.disabled = true;

            button.textContent =
                "Logging in...";


            showMessage(
                "Logging in...",
                "success"
            );


            try {

                const {
                    data,
                    error
                } = await supabase.auth.signInWithPassword({

                    email: email,

                    password: password

                });


                if (error) {

                    throw error;

                }


                if (!data || !data.user) {

                    throw new Error(
                        "Login failed. Please try again."
                    );

                }


                showMessage(
                    "Login successful! Redirecting...",
                    "success"
                );


                button.textContent =
                    "Logged In";


                setTimeout(
                    function() {

                        window.location.href =
                            "dashboard.html";

                    },
                    1000
                );


            } catch (error) {

                console.error(
                    "Login error:",
                    error
                );


                let errorMessage =
                    "Unable to login. Please check your email and password.";


                if (error && error.message) {

                    errorMessage =
                        error.message;

                }


                showMessage(
                    errorMessage,
                    "error"
                );


                button.disabled = false;

                button.textContent =
                    "Login";

            }

        }
    );


    /* =========================================
       FORGOT PASSWORD
       ========================================= */

    forgotPassword.addEventListener(
        "click",
        async function(event) {

            event.preventDefault();


            const email =
                emailInput.value.trim();


            if (!email) {

                showMessage(
                    "Enter your email address first, then tap Forgot Password.",
                    "error"
                );

                emailInput.focus();

                return;

            }


            try {

                const { error } =
                    await supabase.auth.resetPasswordForEmail(
                        email,
                        {
                            redirectTo:
                                window.location.origin +
                                "/reset-password.html"
                        }
                    );


                if (error) {

                    throw error;

                }


                showMessage(
                    "Password reset instructions have been sent to your email.",
                    "success"
                );


            } catch (error) {

                console.error(
                    "Password reset error:",
                    error
                );


                showMessage(
                    error.message ||
                    "Unable to send password reset email.",
                    "error"
                );

            }

        }
    );

</script>

</body>
</html>
