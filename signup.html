<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | SMoney</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .logo span {
            color: #2563eb;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #93c5fd;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            line-height: 1.5;
        }

        .login {
            text-align: center;
            margin-top: 22px;
            color: #6b7280;
        }

        .login a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #374151;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        S<span>Money</span>
    </div>

    <div class="card">

        <h1>Create Account</h1>

        <p class="subtitle">
            Create your SMoney account
        </p>

        <form id="signupForm">

            <label for="fullname">
                Full Name
            </label>

            <input
                type="text"
                id="fullname"
                name="fullname"
                placeholder="Enter your full name"
                required
            >

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                required
                minlength="6"
            >

            <label for="confirm-password">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirm-password"
                name="confirm-password"
                placeholder="Confirm your password"
                required
                minlength="6"
            >

            <button type="submit" id="signupButton">
                Create Account
            </button>

            <p id="message"></p>

        </form>

        <div class="login">
            Already have an account?
            <a href="login.html">Log in</a>
        </div>

        <a href="index.html" class="back">
            ← Back to SMoney
        </a>

    </div>

</div>


<script type="module">

    import { createClient } from
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    // YOUR SMONEY SUPABASE PROJECT
    const SUPABASE_URL =
        "https://ljmpfkdursxpoxhdvel.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_5_u__3sf1VxfLTRupenrvw_6TfA3xeA";


    // Connect to Supabase
    const supabase = createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


    const form =
        document.getElementById("signupForm");

    const button =
        document.getElementById("signupButton");

    const message =
        document.getElementById("message");


    function showMessage(text, type) {

        message.textContent = text;

        if (type === "success") {
            message.style.color = "green";
        } else {
            message.style.color = "red";
        }
    }


    form.addEventListener("submit", async function(event) {

        event.preventDefault();


        const fullname =
            document.getElementById("fullname").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const phone =
            document.getElementById("phone").value.trim();

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirm-password").value;


        // Check passwords
        if (password !== confirmPassword) {

            showMessage(
                "Passwords do not match.",
                "error"
            );

            return;
        }


        // Check password length
        if (password.length < 6) {

            showMessage(
                "Password must be at least 6 characters.",
                "error"
            );

            return;
        }


        // Disable button
        button.disabled = true;

        button.textContent = "Creating Account...";

        message.textContent = "";


        try {

            const { data, error } =
                await supabase.auth.signUp({

                    email: email,

                    password: password,

                    options: {

                        data: {
                            full_name: fullname,
                            phone: phone
                        }

                    }

                });


            if (error) {

                showMessage(
                    error.message,
                    "error"
                );

                button.disabled = false;

                button.textContent = "Create Account";

                return;
            }


            // Successful signup
            if (data.session) {

                showMessage(
                    "Account created successfully. Redirecting...",
                    "success"
                );

                setTimeout(function() {

                    window.location.href =
                        "dashboard.html";

                }, 1000);

            } else {

                showMessage(
                    "Account created! Please check your email to confirm your account.",
                    "success"
                );

                button.disabled = false;

                button.textContent = "Create Account";
            }


        } catch (error) {

    showMessage(
        "ERROR: " + error.message,
        "error"
    );

    console.error(error);

            button.disabled = false;

            button.textContent = "Create Account";
        }

    });

</script>

</body>
</html>
