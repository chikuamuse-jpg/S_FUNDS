<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | SMoney</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .logo span {
            color: #2563eb;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            background: #93c5fd;
            cursor: not-allowed;
        }

        .login {
            text-align: center;
            margin-top: 22px;
            color: #6b7280;
        }

        .login a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #374151;
            text-decoration: none;
        }

        #message {
            display: none;
            margin-top: 18px;
            padding: 14px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }

        #message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        #message.error {
            display: block;
            background: #fee2e2;
            color: #b91c1c;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        S<span>Money</span>
    </div>

    <div class="card">

        <h1>Create Account</h1>

        <p class="subtitle">
            Create your SMoney account
        </p>

        <form id="signupForm">

            <label for="fullname">
                Full Name
            </label>

            <input
                type="text"
                id="fullname"
                placeholder="Enter your full name"
                required
            >

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="Enter your phone number"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                minlength="6"
                required
            >

            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                minlength="6"
                required
            >

            <!-- IMPORTANT: type="button" -->
            <button
                type="button"
                id="signupButton"
            >
                Create Account
            </button>

        </form>

        <div id="message"></div>

        <div class="login">
            Already have an account?
            <a href="login.html">Log in</a>
        </div>

        <a href="index.html" class="back">
            ← Back to SMoney
        </a>

    </div>

</div>


<script type="module">

    import { createClient } from
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    /* ==============================
       YOUR SUPABASE CONNECTION
       ============================== */

    const SUPABASE_URL =
        "https://ljmpfkdursxpoxkhdvel.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxqbXBma2R1cnN4cG94a2hkdmVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMTE0NzMsImV4cCI6MjEwMjg4NzQ3M30.u7aYKII3RPLNrIz5sn9xzxXFuPg79Fabm6filX1vHF8";


    const supabase = createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


    /* ==============================
       GET HTML ELEMENTS
       ============================== */

    const button =
        document.getElementById("signupButton");

    const message =
        document.getElementById("message");


    /* ==============================
       SHOW MESSAGE
       ============================== */

    function showMessage(text, type) {

        message.textContent = text;

        message.className = type;

    }


    /* ==============================
       CREATE ACCOUNT
       ============================== */

    button.addEventListener("click", async function () {

        const fullname =
            document.getElementById("fullname").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const phone =
            document.getElementById("phone").value.trim();

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;


        /* Clear previous message */

        message.textContent = "";
        message.className = "";


        /* Check required fields */

        if (!fullname ||
            !email ||
            !phone ||
            !password ||
            !confirmPassword) {

            showMessage(
                "Please fill in all fields.",
                "error"
            );

            return;
        }


        /* Check passwords */

        if (password !== confirmPassword) {

            showMessage(
                "Passwords do not match.",
                "error"
            );

            return;
        }


        /* Check password length */

        if (password.length < 6) {

            showMessage(
                "Password must be at least 6 characters.",
                "error"
            );

            return;
        }


        /* Disable button */

        button.disabled = true;

        button.textContent =
            "Creating Account...";


        try {

            const { data, error } =
                await supabase.auth.signUp({

                    email: email,

                    password: password,

                    options: {

                        data: {
                            full_name: fullname,
                            phone: phone
                        },

                        emailRedirectTo:
                            window.location.origin +
                            "/login.html"
                    }

                });


            /* Supabase returned an error */

            if (error) {

                throw error;

            }


            /* Make sure account was created */

            if (!data || !data.user) {

                throw new Error(
                    "Account was not created."
                );

            }


            /* Success */

            showMessage(
                "Account created successfully!",
                "success"
            );


            button.textContent =
                "Account Created";


            /*
             * Wait 1.5 seconds,
             * then go to login page.
             */

            setTimeout(function () {

                window.location.href =
                    "login.html";

            }, 1500);


        } catch (error) {

            console.error(
                "Supabase signup error:",
                error
            );


            showMessage(
                error.message ||
                "Unable to create account.",
                "error"
            );


            button.disabled = false;

            button.textContent =
                "Create Account";

        }

    });

</script>

</body>
</html>
